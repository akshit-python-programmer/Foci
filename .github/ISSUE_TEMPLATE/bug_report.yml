name: Bug report
description: Something in Foci isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Foci
        2. Right-click a to-do → Schedule for Tomorrow
        3. ...
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run Foci?
      options:
        - From source (python main.py)
        - Packaged .exe / app
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshot
      description: Anything printed in the terminal, or a screenshot of the problem. Remove anything personal.
      render: text
